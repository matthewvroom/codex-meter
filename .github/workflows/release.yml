name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v${VERSION}" = "$GITHUB_REF_NAME"
      - name: Run deterministic checks
        env:
          SKIP_LIVE_CODEX_CHECK: "1"
        run: ./scripts/test.sh
      - name: Build and verify release archive
        run: zsh ./scripts/package-release.sh
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Codex-Meter-${GITHUB_REF_NAME#v}.zip" \
            --draft \
            --title "Codex Meter ${GITHUB_REF_NAME#v}" \
            --generate-notes
